version: '3.8'

services:
  isodiagram:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - isodiagram-data:/app/apps/api/data/diagrams
      - isodiagram-assets:/app/apps/api/data/assets/imported
      - isodiagram-base-assets:/app/apps/api/data/assets/base
    environment:
      - BACKEND_PORT=3001
      - ENABLE_SERVER_STORAGE=true
      - STORAGE_PATH=/app/apps/api/data/diagrams
      - DOWNLOAD_ASSETS_PATH=/app/apps/api/data/assets/imported
      - WEB_APP_URL=http://localhost:3001
    restart: unless-stopped

volumes:
  isodiagram-data:
  isodiagram-assets:
  isodiagram-base-assets:
